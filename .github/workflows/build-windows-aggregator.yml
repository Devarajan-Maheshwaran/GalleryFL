name: Build Windows Aggregator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install locked build inputs
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install "pyinstaller==6.16.0"
          python -m pip freeze | Sort-Object | Set-Content THIRD_PARTY_PACKAGES.txt

      - name: Build one-folder Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --console `
            --name "GalleryFL-Aggregator" `
            --contents-directory "_internal" `
            --icon "server/assets/galleryfl.ico" `
            --version-file "server/windows_version_info.txt" `
            --paths "server" `
            --add-data "server/dashboard;dashboard" `
            --add-data "server/models;models" `
            --add-data "server/taxonomy.json;." `
            --add-data "server/config.json;." `
            --collect-all "uvicorn" `
            --collect-submodules "websockets" `
            "server/windows_entry.py"

          Copy-Item README.md "dist/GalleryFL-Aggregator/PROJECT_README.md"
          Copy-Item SRS.md "dist/GalleryFL-Aggregator/SRS.md"
          Copy-Item THIRD_PARTY_PACKAGES.txt "dist/GalleryFL-Aggregator/THIRD_PARTY_PACKAGES.txt"

          @"
          GalleryFL Aggregator for Windows x64
          ====================================

          Run GalleryFL-Aggregator.exe. The first launch creates persistent state in:
          %LOCALAPPDATA%\GalleryFL\Aggregator

          The dashboard opens at http://localhost:8000/dashboard/.
          Keep the console window open; press Ctrl+C to stop the server.

          This binary is not digitally signed. Verify the release SHA-256 before use.
          Do not expose the server directly to the public internet.
          "@ | Set-Content "dist/GalleryFL-Aggregator/README-WINDOWS.txt"

      - name: Generate internal checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path "dist/GalleryFL-Aggregator").Path
          $lines = Get-ChildItem $root -Recurse -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($root.Length + 1).Replace([char]92,'/')
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $relative"
            }
          $lines | Set-Content "$root/SHA256SUMS.txt"

      - name: Smoke-test the compiled executable
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$pwd\windows-smoke-appdata"
          $env:FGT_NO_BROWSER = "1"
          $process = Start-Process `
            -FilePath "$pwd\dist\GalleryFL-Aggregator\GalleryFL-Aggregator.exe" `
            -WorkingDirectory "$pwd\dist\GalleryFL-Aggregator" `
            -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $schema = Invoke-RestMethod "http://127.0.0.1:8000/api/model/schema" -TimeoutSec 2
                if ($schema.num_classes -eq 7 -and $schema.model_version -eq 2) {
                  $ready = $true
                  break
                }
              } catch {}
              if ($process.HasExited) { throw "Executable exited with code $($process.ExitCode)" }
            }
            if (-not $ready) { throw "Compiled server did not become ready" }
            $comparison = Invoke-RestMethod "http://127.0.0.1:8000/api/metrics/comparison"
            if (-not $comparison.evaluated) { throw "Runtime baseline evaluation was not populated" }
            $configPath = "$env:LOCALAPPDATA\GalleryFL\Aggregator\config.json"
            $persisted = Get-Content $configPath | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace($persisted.server_token)) {
              throw "Generated access token was not persisted"
            }
            Write-Host "WINDOWS_EXECUTABLE_SMOKE_TEST_PASS"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Create the single public ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive `
            -Path "dist/GalleryFL-Aggregator/*" `
            -DestinationPath "release/GalleryFL-Aggregator-Windows-x64.zip" `
            -CompressionLevel Optimal
          $hash = (Get-FileHash "release/GalleryFL-Aggregator-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  GalleryFL-Aggregator-Windows-x64.zip" | Set-Content "release/GalleryFL-Aggregator-Windows-x64.zip.sha256"
          Get-ChildItem release

      - name: Upload verified Windows release
        uses: actions/upload-artifact@v4
        with:
          name: GalleryFL-Aggregator-Windows-x64
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
